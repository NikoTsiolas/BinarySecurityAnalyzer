[project]
name = "bintriage"
version = "0.1.0"
description = "Static triage of software binaries and installers: go/no-go risk report for corporate install approval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pefile>=2024.8.26",
    "python-magic>=0.4.27",
    "jinja2>=3.1",
    "requests>=2.32",
]

[project.scripts]
bintriage = "bintriage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bintriage"]
